# Static Astro site — run `npm run build`, then `node scripts/wrangler-deploy.mjs` (not bare npx wrangler deploy).
# Do not use `astro add cloudflare` (SSR); this project is fully static HTML in /dist.
name = "dotahacks"
compatibility_date = "2024-09-01"

[assets]
directory = "./dist"
not_found_handling = "404-page"
html_handling = "force-trailing-slash"
